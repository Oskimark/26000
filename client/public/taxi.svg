<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="winGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="roofSign" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Sombra inferior suave -->
  <ellipse cx="120" cy="74" rx="100" ry="4.5" fill="rgba(0,0,0,0.35)"/>

  <!-- Resplandor cartel de techo -->
  <ellipse cx="120" cy="22" rx="28" ry="10" fill="rgba(250,204,21,0.4)" filter="url(#softGlow)"/>

  <!-- Cartel Taxi Techo -->
  <path d="M 103 16 L 137 16 L 140 27 L 100 27 Z" fill="url(#roofSign)" stroke="#854d0e" stroke-width="1.2"/>
  <text x="120" y="25" font-family="Arial Black, Impact, sans-serif" font-size="8.5" font-weight="900" fill="#18181b" text-anchor="middle" letter-spacing="1">TAXI</text>

  <!-- Carrocería principal (sedán moderno apuntando a la izquierda) -->
  <path d="
    M 22 62 
    L 14 56 
    Q 10 49 18 46 
    L 48 43 
    L 72 26 
    Q 82 22 102 22 
    L 155 22 
    Q 168 22 182 33 
    L 215 41 
    Q 228 44 228 52 
    L 225 62 
    L 205 62 
    A 18 18 0 0 0 169 62 
    L 77 62 
    A 18 18 0 0 0 41 62 
    Z
  " fill="url(#bodyGrad)" stroke="#854d0e" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Faro delantero (izq) con brillo -->
  <path d="M 13 52 Q 22 50 25 54 L 14 56 Z" fill="#ffffff" stroke="#eab308" stroke-width="0.8"/>
  <ellipse cx="16" cy="53" rx="2" ry="1.5" fill="#fef08a"/>

  <!-- Faro trasero (der) -->
  <path d="M 227 49 Q 220 51 216 47 L 223 44 Z" fill="#ef4444" stroke="#991b1b" stroke-width="0.8"/>

  <!-- Ventanilla delantera (izq) -->
  <path d="M 74 29 L 95 29 L 95 43 L 53 43 Q 64 32 74 29 Z" fill="url(#winGrad)" stroke="#0f172a" stroke-width="1.2"/>
  <!-- Ventanilla trasera (der) -->
  <path d="M 100 29 L 152 29 Q 163 29 173 39 L 173 43 L 100 43 Z" fill="url(#winGrad)" stroke="#0f172a" stroke-width="1.2"/>

  <!-- Espejo retrovisor -->
  <path d="M 52 42 Q 45 40 45 44 Q 48 46 54 45 Z" fill="#ca8a04" stroke="#713f12" stroke-width="0.8"/>

  <!-- Parantes / Marcos de puerta -->
  <line x1="97" y1="28" x2="97" y2="62" stroke="#854d0e" stroke-width="1.5"/>
  <line x1="145" y1="43" x2="145" y2="62" stroke="#854d0e" stroke-width="1"/>

  <!-- Manijas de puerta -->
  <rect x="103" y="46" width="10" height="2.5" rx="1" fill="#713f12"/>
  <rect x="151" y="46" width="10" height="2.5" rx="1" fill="#713f12"/>

  <!-- Franja ajedrezada clásica de taxi (damero) -->
  <g fill="#18181b">
    <!-- Fila 1 -->
    <rect x="32" y="48.5" width="6" height="3"/>
    <rect x="44" y="48.5" width="6" height="3"/>
    <rect x="56" y="48.5" width="6" height="3"/>
    <rect x="68" y="48.5" width="6" height="3"/>
    <rect x="80" y="48.5" width="6" height="3"/>
    <rect x="92" y="48.5" width="6" height="3"/>
    <rect x="104" y="48.5" width="6" height="3"/>
    <rect x="116" y="48.5" width="6" height="3"/>
    <rect x="128" y="48.5" width="6" height="3"/>
    <rect x="140" y="48.5" width="6" height="3"/>
    <rect x="152" y="48.5" width="6" height="3"/>
    <rect x="164" y="48.5" width="6" height="3"/>
    <rect x="176" y="48.5" width="6" height="3"/>
    <rect x="188" y="48.5" width="6" height="3"/>
    <rect x="200" y="48.5" width="6" height="3"/>
    <rect x="212" y="48.5" width="6" height="3"/>
    <!-- Fila 2 -->
    <rect x="38" y="51.5" width="6" height="3"/>
    <rect x="50" y="51.5" width="6" height="3"/>
    <rect x="62" y="51.5" width="6" height="3"/>
    <rect x="74" y="51.5" width="6" height="3"/>
    <rect x="86" y="51.5" width="6" height="3"/>
    <rect x="98" y="51.5" width="6" height="3"/>
    <rect x="110" y="51.5" width="6" height="3"/>
    <rect x="122" y="51.5" width="6" height="3"/>
    <rect x="134" y="51.5" width="6" height="3"/>
    <rect x="146" y="51.5" width="6" height="3"/>
    <rect x="158" y="51.5" width="6" height="3"/>
    <rect x="170" y="51.5" width="6" height="3"/>
    <rect x="182" y="51.5" width="6" height="3"/>
    <rect x="194" y="51.5" width="6" height="3"/>
    <rect x="206" y="51.5" width="6" height="3"/>
    <rect x="218" y="51.5" width="6" height="3"/>
  </g>

  <!-- Rueda delantera (izq, centro en 59, 62) -->
  <circle cx="59" cy="62" r="14.5" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="59" cy="62" r="8.5" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="59" cy="62" r="3.5" fill="#334155"/>

  <!-- Rueda trasera (der, centro en 187, 62) -->
  <circle cx="187" cy="62" r="14.5" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="187" cy="62" r="8.5" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="187" cy="62" r="3.5" fill="#334155"/>
</svg>
